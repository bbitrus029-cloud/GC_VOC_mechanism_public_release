composition_inference:
  compartments:
  - epithelial
  - fibroblast
  - endothelial
  - myeloid
  - T_NK
  - B_plasma
  - mast_other_immune
  families:
    SC_COMPOSITION_PRIMARY: 7
    SC_COMPOSITION_STRICT200: 7
    SC_COMPOSITION_CLR: 7
    SC_COMPOSITION_QUASIBINOMIAL: 7
  shared_entry_condition: all_seven_marker_labels_PASS
  failure_role: NA_NONESTIMABLE_with_author_label_composition_descriptive_only
  primary:
    donors: 20
    threshold: at_least_100_retained_cells_in_each_tissue
    empirical_logit_formula: log((k+0.5)/(n-k+0.5))
    contrast: paired_tumor_minus_NAT
    test: two_sided_one_sample_Student_t_test_of_paired_tumor_minus_NAT_differences
    ci: two_sided_Student_t_95_percent_CI
    family: SC_COMPOSITION_PRIMARY
  strict200:
    donors: 18
    threshold: at_least_200_retained_cells_in_each_tissue
    rule: exact_repeat_of_primary_method_in_18_donors
    family: SC_COMPOSITION_STRICT200
  CLR:
    donors: 20
    threshold: at_least_100_retained_cells_in_each_tissue
    formula: CLR_ij=log(k_ij+0.5)-(1/7)*sum_l_log(k_il+0.5)
    contrast: paired_tumor_minus_NAT
    test: two_sided_one_sample_Student_t_test_of_paired_tumor_minus_NAT_differences
    ci: two_sided_Student_t_95_percent_CI
    family: SC_COMPOSITION_CLR
  quasibinomial:
    donors: 24
    formula: glm(cbind(compartment_count,total_count-compartment_count)~tissue+donor,family=quasibinomial(link=logit))
    fit_engine: stats_glm_with_quasibinomial_logit
    glm_control: stats::glm.control(epsilon=1e-8,maxit=25,trace=FALSE)
    warning_capture: withCallingHandlers_capture_exact_conditionMessage_and_muffle
    recognized_nonestimable_warning_messages:
    - 'glm.fit: algorithm did not converge'
    - 'glm.fit: algorithm stopped at boundary value'
    fitted_probability_boundary_epsilon: 10*.Machine$double.eps
    fitted_probability_boundary_rule: any(fitted_probability<epsilon_or_fitted_probability>1-epsilon)
    unexpected_warning_action: STOP_OWNER_REVIEW
    reference: NAT
    coefficient: tumor_minus_NAT
    statistic: t=beta/SE
    degrees_of_freedom: df.residual
    p_value: two_sided_Student_t
    ci: beta_plus_or_minus_qt_0.975_df_times_SE
    profile_confint_prohibited: true
    nonestimable_if:
    - model_rank_below_model_matrix_column_count
    - fit_converged_not_TRUE
    - fit_boundary_TRUE
    - recognized_nonestimable_warning
    - fitted_probability_at_machine_boundary
    - nonfinite_coefficient
    - nonfinite_SE
    - nonfinite_dispersion
    - df_residual_not_positive
    family: SC_COMPOSITION_QUASIBINOMIAL
