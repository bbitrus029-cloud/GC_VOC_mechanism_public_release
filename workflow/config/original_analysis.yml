schema_version: 2.1.4
programs:
  G_core:
    members:
    - ACSL4
    - LPCAT3
    - ALOX5
    - ALOX12
    - ALOX15
    - ALOX15B
    - POR
    orientation: all_positive
    equal_weight: true
    formal_bulk:
      sources:
      - GSE29272
      - GSE27342
      - GSE122401
      - TCGA_STAD
      required_count: 7
      required_members:
      - ACSL4
      - LPCAT3
      - ALOX5
      - ALOX12
      - ALOX15
      - ALOX15B
      - POR
      reduced_member_fallback: false
    single_cell:
      required_count: 5
      substrate_assembly_minimum: 1
      oxidation_support_minimum: 2
    protein:
      required_count: 6
      members:
      - ACSL4
      - LPCAT3
      - ALOX5
      - ALOX15
      - ALOX15B
      - POR
    bridge:
      required_count: 6
      members:
      - ACSL4
      - LPCAT3
      - ALOX5
      - ALOX15
      - ALOX15B
      - POR
  H_core:
    members:
    - ALDH2
    - ALDH3A1
    - ALDH3A2
    - ALDH7A1
    orientation: all_positive
    equal_weight: true
    formal_bulk:
      sources:
      - GSE29272
      - GSE27342
      - GSE122401
      - TCGA_STAD
      required_count: 4
      required_members:
      - ALDH2
      - ALDH3A1
      - ALDH3A2
      - ALDH7A1
      reduced_member_fallback: false
    single_cell:
      required_count: 3
      fatty_aldehyde_group_minimum: 1
      complementary_group_minimum: 1
    protein:
      required_count: 4
      members:
      - ALDH2
      - ALDH3A1
      - ALDH3A2
      - ALDH7A1
    bridge:
      required_count: 4
      members:
      - ALDH2
      - ALDH3A1
      - ALDH3A2
      - ALDH7A1
  context_programs:
    G_buffer:
    - GPX4
    - SLC7A11
    - GCLC
    - GCLM
    - GSR
    - AIFM2
    - DHODH
    - GCH1
    H_expanded:
    - ALDH1A1
    - ALDH1A3
    - ALDH3B1
    H_reductive:
    - AKR1B1
    - AKR1B10
    H_conjugation:
    - GSTA4
    - GSTP1
    may_rescue_core_result: false
coverage_contracts:
  context_programs:
    G_buffer:
    - GPX4
    - SLC7A11
    - GCLC
    - GCLM
    - GSR
    - AIFM2
    - DHODH
    - GCH1
    H_expanded:
    - ALDH1A1
    - ALDH1A3
    - ALDH3B1
    H_reductive:
    - AKR1B1
    - AKR1B10
    H_conjugation:
    - GSTA4
    - GSTP1
  context_complete_membership_required: true
  missing_fixed_member_action: endpoint_nonestimable_no_reduced_fallback
  G_submodules:
    substrate_assembly:
    - ACSL4
    - LPCAT3
    oxidation_support:
    - ALOX5
    - ALOX12
    - ALOX15
    - ALOX15B
    - POR
    complete_membership_required: true
    role: nominal_diagnostic_no_q_value
  protein_core_common_pairs:
    G: 28
    H: 30
  protein_core_member_pair_rule: all_G_program_and_six_G_member_tests_use_same_28_pairs_all_H_program_and_four_H_member_tests_use_same_30_pairs
  protein_context:
    pair_rule: one_pre_effect_frozen_common_complete_pair_set_per_fixed_program
    pair_exclusion_rule: exclude_patient_from_program_if_any_fixed_member_missing
    member_specific_maximum_n_prohibited: true
    common_pair_set_frozen_before_effect_access: true
scoring:
  primary_rank:
    direction: ascending
    tie_method: average
    background_scope: frozen_source_level
    background_requires_finite_values_in_all_formal_samples: true
    mapping_filtering_and_collapse_before_ranking: true
    rank_formula: R_js=rank_average_ascending(x_js_within_B_k)
    scale_formula: u_js=(R_js-1)/(|B_k|-1)
    program_formula: S_ps=sum(u_js_for_j_in_program)/K
    minimum_background_size: 2
    missing_member_imputation: false
    member_substitution: false
    interpretation: within_source_relative_abundance_position_not_absolute_expression_or_cross_source_calibration
  common_background_sensitivity:
    sources:
    - GSE29272
    - GSE27342
    definition: intersection_of_reliable_canonical_genes_after_mapping_filtering_and_collapse
    freeze_gene_list_and_sha256_before_effect_access: true
  standardized_member_mean:
    role: prespecified_sensitivity
    standardization_universe: pooled_tissue_blind_formal_samples_within_source_and_endpoint
    formula: equal_mean_of_member_z_scores
    zero_variance_action: nonestimable
    may_replace_primary: false
primary_inference:
  paired_program:
    estimand: mean_of_complete_pair_tumor_minus_NAT_score_differences
    test: two_sided_one_sample_Student_t_test_against_zero
    ci: two_sided_Student_t_95_percent_CI_for_mean_difference
    alpha: 0.05
    minimum_pairs: 3
    sd_tolerance_formula: sqrt(.Machine$double.eps)*max(1,max(abs(delta)))
    variance_comparison: var(delta)<=tol(delta)^2
    nonestimable_if:
    - n_less_than_3
    - any_nonfinite_formal_pair_difference
    - effective_zero_SD_of_pair_differences
    nonestimable_state: NA_NONESTIMABLE
    raw_mean_difference_reported_when_computable: true
    infinite_t_or_degenerate_point_interval_prohibited: true
    direction_basis: unrounded_raw_paired_mean_difference
    applies_to:
    - formal_bulk_programs
    - eligible_single_cell_programs
    - protein_programs
    - fixed_context_programs
    - G_submodule_diagnostics
  GSE122401_member_model:
    method: ordinary_limma_empirical_Bayes_paired_patient_plus_tissue
    voom: false
    input: log2_upper_quartile_normalized_RSEM_plus_1
  GSE27342:
    core_64:
      program_method: paired_delta_Student_t_test_and_Student_t_CI
      context_program_method: paired_delta_Student_t_test_and_Student_t_CI
      member_method: ordinary_limma_empirical_Bayes_expression_tissue_plus_patient
      exact_G_and_H_membership: G7_H4
    batch_vulnerability_80:
      permitted_endpoints:
      - G_core_program
      - H_core_program
      member_context_LOO_and_other_extensions_prohibited: true
      exact_G_and_H_membership: G7_H4
    scan_date_role: defines_64_pair_subset_and_QC_only_not_a_model_covariate
  GSE29272_site_interaction:
    model: paired_program_delta_as_function_of_frozen_site
    formula: delta_program_score~site
    hypotheses:
    - G_site_interaction
    - H_site_interaction
    multiplicity_family: BULK_SITE_INTERACTION
    adjustment: BH2
    stratum_estimates_role: nominal_diagnostic_no_separate_q_family
diagnostic_inference:
  paired_wilcoxon:
    method: stats_wilcox_test_paired_TRUE_exact_FALSE_correct_FALSE_two_sided
    multiplicity_role: nominal_diagnostic_no_q_value
    may_change_primary_state: false
diagnostic_bootstrap:
  paired_program:
    resampling_unit: complete_pair_id
    resample_tumor_and_NAT_together: true
    replicates: 10000
    minimum_valid_replicates: 9500
    interval: percentile
    quantile_type: 7
    invalid_replicate_action: discard_nonfinite_and_count
    below_minimum_action: NA_NONESTIMABLE
    alternative_interval_fallback_prohibited: true
    multiplicity_role: nominal_diagnostic_no_q_value
    may_change_primary_state: false
bridge_inference:
  point_estimate: Spearman_rho
  nominal_p_method: stats_cor_test_method_spearman_exact_FALSE_two_sided
  biological_unit: patient_complete_RNA_tumor_RNA_NAT_protein_tumor_protein_NAT_quadruplet
  minimum_complete_cases: 15
  bootstrap_resampling_unit: complete_patient_quadruplet
  replicates: 10000
  minimum_valid_replicates: 9500
  primary_interval: patient_pair_bootstrap_percentile_type_7
  sensitivity_interval: BCa_when_estimable
  invalid_replicate_action: discard_nonfinite_and_count
  below_minimum_action: bridge_nonestimable
  alternative_primary_interval_fallback_prohibited: true
  multiplicity_family: CPTAC_BRIDGE
  state_order:
  - bridge_nonestimable
  - bridge_supported
  - bridge_uncertain
  bridge_nonestimable_rule: n_less_than_15_or_nonfinite_rho_or_valid_bootstrap_replicates_below_9500_or_required_input_invalid
  bridge_supported_rule: BH2_q_below_0.05_and_primary_percentile_CI_excludes_zero
  bridge_uncertain_rule: estimable_and_not_bridge_supported
  bridge_q_ci_inconsistent: XOR(BH2_q_below_0.05,primary_percentile_CI_excludes_zero)
  bridge_nominal_p_ci_inconsistent: XOR(nominal_P_below_0.05,primary_percentile_CI_excludes_zero)
  inconsistency_flag_nonestimable_value: NA_NONESTIMABLE
paired_effect:
  native_difference: mean_of_within_pair_tumor_minus_NAT_differences
  standardized_measure: paired_Hedges_g_av
  implementation_contract: Morris_DeShon_SMCRP_LS
  metafor_DESCRIPTION_version: 5.0-1
  metafor_packageVersion: 5.0.1
  package_crosscheck: metafor_escalc_measure_SMCRP_vtype_LS_correct_TRUE
  package_tolerance: 1.0e-12
  s_av_formula: sqrt((s_T^2+s_N^2)/2)
  d_av_formula: (mean_T-mean_N)/s_av
  m_formula: 2*(n-1)/(1+r^2)
  J_formula: exp(lgamma(m/2)-0.5*log(m/2)-lgamma((m-1)/2))
  g_av_formula: J(m)*d_av
  variance_formula: 2*(1-r)/n + g_av^2*(1+r^2)/(4*n)
  ci_formula: g_av +/- qnorm(0.975)*sqrt(variance)
  correlation: complete_case_Pearson_same_pairs_same_order
  minimum_pairs: 3
  sd_tolerance_formula: sqrt(.Machine$double.eps)*max(1,max(abs(x)))
  nonestimable_if:
  - n_less_than_3
  - nonfinite_correlation
  - effective_zero_variance_in_either_tissue
  native_difference_reported_when_g_av_nonestimable: true
result_states:
  direction_basis: unrounded_raw_paired_mean_difference
  active_C1_source_pair:
    selection: two_technically_eligible_core_sources_after_frozen_backup_branch
    normal_branch:
    - GSE29272
    - GSE27342_64
    one_failure_branch_uses: GSE122401
    effect_results_may_not_trigger_branch: true
  dimension_A:
    input: valid_native_paired_program_estimates_and_declared_BH2_q_values
    remains_valid_when_g_av_is_nonestimable: true
    direction_inputs:
    - active_source_1_unrounded_raw_paired_mean_difference
    - active_source_2_unrounded_raw_paired_mean_difference
    same_direction_rule: product_of_unrounded_raw_paired_mean_differences_greater_than_zero
    opposite_direction_rule: product_of_unrounded_raw_paired_mean_differences_less_than_zero
    exact_zero_rule: either_valid_unrounded_raw_paired_mean_difference_exactly_zero_assigns_uncertain
    classification_precedence:
    - non_estimable
    - uncertain_exact_zero
    - replicated_program_change
    - directionally_consistent_partial_support
    - concordant_but_inconclusive
    - opposite_direction_statistical_conflict
    - directionally_discordant_inconclusive
    - uncertain_catch_all
  magnitude:
    input: paired_Hedges_g_av_for_active_C1_source_pair
    nonestimable_state: magnitude_nonestimable_g_av
    dependent_flag_nonestimable_value: NA_NONESTIMABLE
    nonestimable_if_either_active_source_g_av_invalid: true
  reproducibility:
    replicated_program_change: both_core_BH2_q_below_0.05_and_same_nonzero_direction
    directionally_consistent_partial_support: exactly_one_core_BH2_q_below_0.05_and_same_nonzero_direction
    concordant_but_inconclusive: neither_core_BH2_q_below_0.05_and_same_nonzero_direction
    opposite_direction_statistical_conflict: both_core_BH2_q_below_0.05_and_opposite_direction
    directionally_discordant_inconclusive: fewer_than_two_core_BH2_q_below_0.05_and_opposite_direction
    uncertain: both_core_estimates_valid_but_no_prior_explicit_pattern_applies
    non_estimable: required_core_estimate_invalid_after_frozen_backup_rule
  zero_point_estimate_flag:
    basis: any_unrounded_raw_paired_mean_difference_exactly_zero
    changes_scientific_state: false
  small_effect_region:
    label: both_core_CI_bounded_within_small_effect_region
    lower_bound: -0.2
    upper_bound: 0.2
    lower_operator: '>'
    upper_operator: <
    requires_both_core_cohorts: true
    equivalence_test: false
    TOST: false
  precision_uncertain:
    rule: at_least_one_core_CI_includes_zero_and_reaches_or_crosses_minus_0.20_or_plus_0.20
    mutually_exclusive_with_small_effect_region_flag: true
diagnostics:
  direction_comparison:
    same: product_greater_than_zero
    opposite: product_less_than_zero
    strict_zero: uncertain_not_directional
  loo_direction_stable_by_source:
    status_values:
    - 'TRUE'
    - 'FALSE'
    - NA_NONESTIMABLE
    - NA_NOT_DIRECTIONAL
    direction_basis: unrounded_raw_paired_mean_difference
    output_shape: source_by_axis_by_deleted_member_long_table
    full_zero_state: NA_NOT_DIRECTIONAL
    LOO_nonestimable_state: NA_NONESTIMABLE
    same_nonzero_direction_state: 'TRUE'
    opposite_direction_state: 'FALSE'
    loo_zero_state: 'FALSE'
  loo_direction_stable_both_core:
    status_values:
    - 'TRUE'
    - 'FALSE'
    - NA_NONESTIMABLE
    - NA_NOT_DIRECTIONAL
    aggregate_priority:
    - 'FALSE'
    - NA_NONESTIMABLE
    - NA_NOT_DIRECTIONAL
    - 'TRUE'
    true_rule: all_required_deletions_in_both_core_sources_are_TRUE
  member_direction_concordance:
    numerator: members_with_same_nonzero_raw_mean_difference_sign_as_full_program
    denominator_G: 7
    denominator_H: 4
    exact_zero_counts_as_concordant: false
    full_program_zero_state: NA_NOT_DIRECTIONAL
  loo_replication_label_sensitive:
    status_values:
    - 'TRUE'
    - 'FALSE'
    - NA_NONESTIMABLE
    changes_primary_label: false
    recompute_G_rule: LOO_G_nominal_P_plus_primary_H_nominal_P_then_BH2_per_source
    recompute_H_rule: primary_G_nominal_P_plus_LOO_H_nominal_P_then_BH2_per_source
    aggregate_rule: any_estimable_label_change_TRUE_else_any_required_nonestimable_NA_NONESTIMABLE_else_FALSE
  score_method_sensitive:
    direction_basis: raw_paired_mean_difference
    true_rule: any_estimable_primary_rank_and_standardized_member_mean_comparison_has_opposite_nonzero_direction
    false_rule: no_estimable_opposite_and_no_required_alternative_nonestimable
    secondary_nonestimable_state: NA_NONESTIMABLE
    zero_direction_rule: estimable_exact_zero_is_not_opposite_so_flag_FALSE_unless_another_comparison_is_opposite
    zero_direction_interpretation: FALSE_does_not_support_directional_robustness_when_either_direction_is_exactly_zero
    required_output_fields:
    - primary_rank_unrounded_raw_paired_mean_difference
    - standardized_member_mean_unrounded_raw_paired_mean_difference
    - primary_rank_direction
    - standardized_member_mean_direction
    - score_method_sensitive
    - score_method_nonestimable
    - exact_zero_direction_flag
  score_method_nonestimable:
    status_values:
    - 'TRUE'
    - 'FALSE'
    true_rule: any_required_standardized_member_mean_comparison_nonestimable
  member_dominated_label_permitted: false
